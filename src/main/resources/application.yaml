spring:
  application:
    name: schoolsystem
  datasource:
    # Cloud variable SPRING_DATASOURCE_URL ko read karega, warna localhost use karega
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.subhiboubhfxfugveypw}
    password: ${SPRING_DATASOURCE_PASSWORD:Ashish12345687*$#}
    hikari:
      maximum-pool-size: 3      # Maximum 3 connections hi banayega
      minimum-idle: 1           # Khali time mein sirf 1 connection active rakhega
      idle-timeout: 30000       # 30 seconds idle rehne par connection close karega
      max-lifetime: 600000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

